# Lets users of the pre-commit framework add blot with:
#   - repo: https://github.com/Sym-jay/Blot
#     rev: v0.4.0
#     hooks: [{id: blot}]
# The first commit indexes the repo's history; later commits refresh the index incrementally.
- id: blot
  name: blot (history-aware checks)
  entry: blot check --staged
  language: python
  pass_filenames: false
  always_run: true
  # blot warns without failing the commit, and pre-commit hides output of passing hooks
  verbose: true
  stages: [pre-commit]
