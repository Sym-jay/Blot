[project]
name = "blot-git"
version = "0.1.0"
description = "A pre-commit check that has read your project's history: warns when a change removes a fix, re-adds a fixed bug, or forgets a file that always changes too."
readme = "docs/PYPI.md"  # text-only; the GitHub README's relative Sora images break on PyPI
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Shyam" }]
keywords = ["git", "pre-commit", "git-history", "code-review", "developer-tools"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Software Development :: Version Control :: Git",
]
# core is stdlib-only: fast hook startup, trivial install. 3.10 has no tomllib, so it gets tomli
dependencies = ["tomli>=1.1.0; python_version < '3.11'"]

[project.urls]
Homepage = "https://github.com/Sym-jay/Blot"
Issues = "https://github.com/Sym-jay/Blot/issues"

[project.optional-dependencies]
github = []        # PR/issue enrichment uses the `gh` CLI or urllib; no extra deps planned
dev = ["pytest>=8"]

[project.scripts]
blot = "blot.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/blot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
